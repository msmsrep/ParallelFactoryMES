# ビルドとテスト（DoD 1・2 を push / PR ごとに機械的に確認する）
# ソリューションに MesApp.Desktop（net10.0-windows）を含むため、開発機と同じ Windows で流す
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # release.yml から「テストが通ったら配布物を作る」ために呼ぶ
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ビルド
        run: dotnet build ParallelFactoryMES.slnx -c Release --nologo

      - name: テスト
        run: dotnet test ParallelFactoryMES.slnx -c Release --no-build --nologo --logger "trx" --results-directory TestResults

      - name: テスト結果を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
