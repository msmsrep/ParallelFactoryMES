# 依存パッケージの更新確認（週1回）。更新があれば dev 向けの PR を作る
# PR は担当者に自分を割り当て、「Assigned」の一覧に出す
# pulls/inbox に出すためのレビュー依頼は .github/CODEOWNERS で付ける（担当者だけでは Inbox に出ない）
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - msmsrep
    commit-message:
      prefix: "依存更新"
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x は Microsoft.OpenApi 3.0 未満に制限している。.NET 11 へ移行するときに外す
      - dependency-name: Microsoft.OpenApi
        update-types:
          - version-update:semver-major
    groups:
      # Microsoft.* / System.* は同じサービシングで揃えて上げる（版がずれると NU1605 の格下げエラーになる）
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - minor
          - patch
      others:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    assignees:
      - msmsrep
    commit-message:
      prefix: "依存更新"
    groups:
      actions:
        patterns:
          - "*"
