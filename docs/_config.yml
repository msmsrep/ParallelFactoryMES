# Parallel Factory MES ユーザーガイド（GitHub Pages 設定）
#
# 公開手順：
#   GitHub リポジトリ → Settings → Pages → Build and deployment
#     Source: Deploy from a branch
#     Branch: master（または main） / フォルダ: /docs
#   数分後に https://<ユーザー名>.github.io/<リポジトリ名>/ で公開されます。
#
# ページ間のリンクはすべて相対リンク（例: getting-started.html）のため、
# baseurl の設定は不要です。テーマは使わず _layouts/default.html を使用します。

# 公開URL（末尾は /）。canonical・hreflang・OGP・sitemap.xml の完全なURLだけに使う（ページ間のリンクは相対のまま）。
# フォークして別の場所で公開するときはここを書き換える
site_url: https://msmsrep.github.io/ParallelFactoryMES/

title: Parallel Factory MES ユーザーガイド
description: 製造実績管理システム Parallel Factory MES の操作マニュアル

lang: ja
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - Gemfile
  - Gemfile.lock

# 左サイドバーのナビゲーションは _data/nav.yml、レイアウトの文言は _data/ui.yml（言語ごと）

# 英語版（docs/en/）。同じファイル名で日本語版と対応させる（docs-dev/GuideEnPlan.md）
defaults:
  - scope:
      path: "en"
    values:
      lang: en
      root: "../"
